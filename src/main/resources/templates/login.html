<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login - G-NEWS</title>
  <link rel="stylesheet" th:href="@{/assets/css/login.css}">
  <link rel="stylesheet" th:href="@{/assets/css/global.css}">
  <script th:src="@{/assets/js/login.js}" defer></script>
  <!-- Google reCAPTCHA script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #2c3e2d;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    
    .login-header p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .login-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      text-align: center;
    }
    
    .login-actions p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #999;
      font-size: 13px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .divider::before {
      margin-right: 10px;
    }
    
    .divider::after {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-header">
      <h1>G-NEWS</h1>
      <p>Welcome back! Please sign in to continue</p>
    </div>

    <div th:if="${error}" class="error">
      <p th:text="${error}"></p>
    </div>

    <form th:action="@{/}" th:object="${loginForm}" method="post" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required placeholder="Enter your password">
      </div>

      <!-- Google reCAPTCHA box -->
      <div class="g-recaptcha" style="margin: 15px 0; display: flex; justify-content: center;"
           data-sitekey="6LdLb90rAAAAABLPwE0ioGTfHNZbdKNdxTkzhwKn">
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="login-actions">
      <div class="divider">or</div>
      <p>Don't have an account?</p>
      <a th:href="@{/signup}">
        <button type="button" class="btn secondary">Create Account</button>
      </a>
      <p style="margin-top: 8px;">
        <a th:href="@{/forgot-password}" class="link">Forgot Password?</a>
      </p>
    </div>
  </div>

  <input type="hidden" id="loginError" th:value="${error}">
  <input type="hidden" id="loginSuccess" th:value="${param.success}">
  <input type="hidden" id="loginRegistered" th:value="${param.registered}">
</body>
</html>
