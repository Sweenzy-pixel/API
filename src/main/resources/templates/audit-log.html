<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Audit Trail</title>
  <link rel="stylesheet" th:href="@{/assets/css/global.css}">
  <link rel="stylesheet" th:href="@{/assets/css/common.css}">
  <script th:src="@{/assets/js/ajax-navigation.js}" defer></script>

  <style>
    html, body { 
      height:100%; 
      margin:0; 
      padding:0; 
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f5f5f5; 
    }
    
    .audit-header {
      background: #ffffff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .filter-section {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .filter-group label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    
    .filter-group input,
    .filter-group select {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      min-width: 200px;
    }
    
    .filter-btn {
      background: #96A78D;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    
    .filter-btn:hover {
      background: #7a9670;
    }
    
    .clear-btn {
      background: #fff;
      color: #666;
      border: 1px solid #ddd;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .clear-btn:hover {
      background: #f5f5f5;
    }
    
    .audit-table-container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    .table-wrapper {
      overflow-x: auto;
      width: 100%;
    }
    
    .audit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 800px;
    }
    
    .audit-table thead {
      background: #f8f9fa;
    }
    
    .audit-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #e0e0e0;
      font-size: 13px;
      position: relative;
    }
    
    .audit-table th.sortable {
      cursor: pointer;
      user-select: none;
    }
    
    .audit-table th.sortable:hover {
      background: #e9ecef;
    }
    
    .sort-icon {
      margin-left: 6px;
      font-size: 12px;
      color: #999;
    }
    
    .audit-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      color: #555;
    }
    
    .audit-table tbody tr:hover {
      background: #f8f9fa;
    }
    
    .audit-table tbody tr:last-child td {
      border-bottom: none;
    }
    
    .user-id {
      font-family: monospace;
      color: #666;
    }
    
    .username {
      font-weight: 500;
      color: #333;
    }
    
    .action-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .action-login {
      background: #d4edda;
      color: #155724;
    }
    
    .action-upload {
      background: #d1ecf1;
      color: #0c5460;
    }
    
    .action-download {
      background: #fff3cd;
      color: #856404;
    }
    
    .action-default {
      background: #e2e3e5;
      color: #383d41;
    }
    
    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 16px 20px;
      background: #fafafa;
      border-top: 1px solid #e0e0e0;
    }
    
    .pagination-btn {
      background: #96A78D;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    .pagination-btn:hover {
      background: #7a9670;
    }
    
    .pagination-input {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px 10px;
      width: 50px;
      text-align: center;
      font-size: 13px;
      background: white;
    }
    
    .pagination-text {
      color: #666;
      font-size: 13px;
      margin: 0 4px;
    }
    
    .back-link {
      color: #ffffff;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <!-- ===== Navigation Bar ===== -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <a th:href="@{/home}">G-NEWS</a>
      </div>
      <ul class="nav-menu">
        <li><a th:href="@{/home}">Home</a></li>
        <li><a th:href="@{/csv/history}">CSV Files</a></li>
        <li><a th:href="@{/csv/template}">Make a Template</a></li>
        <li><a th:href="@{/csv/upload}">Upload CSV</a></li>
        <li><a th:href="@{/audit-log}">Audit Trail</a></li>
        <li><a th:href="@{/}">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Main Content ===== -->
  <div class="main-content">
    <div class="page-header">
      <h1 class="page-title">Audit Trail</h1>
      <p class="page-subtitle">View all system activities and user actions</p>
    </div>
    
    <div class="audit-header">
      <form method="get" th:action="@{/audit-log}" class="filter-section">
        <div class="filter-group">
          <label for="username">User name</label>
          <input type="text" id="username" name="username" 
                 th:value="${filterUsername}" 
                 placeholder="Filter by username">
        </div>
        <div class="filter-group">
          <label for="action">Action</label>
          <select id="action" name="action">
            <option value="">All Actions</option>
            <option value="Login" th:selected="${filterAction == 'Login'}">Login</option>
            <option value="CSV Upload" th:selected="${filterAction == 'CSV Upload'}">CSV Upload</option>
            <option value="CSV Download" th:selected="${filterAction == 'CSV Download'}">CSV Download</option>
            <option value="Template Created" th:selected="${filterAction == 'Template Created'}">Template Created</option>
            <option value="Template Downloaded" th:selected="${filterAction == 'Template Downloaded'}">Template Downloaded</option>
          </select>
        </div>
        <button type="submit" class="filter-btn">Filter</button>
        <a th:href="@{/audit-log}" class="clear-btn">Clear</a>
      </form>
    </div>

    <div class="audit-table-container">
      <div class="table-wrapper">
        <table class="audit-table">
          <thead>
            <tr>
              <th>User ID</th>
              <th>User name</th>
              <th class="sortable">Date & Time <span class="sort-icon">⇅</span></th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${auditLogs == null or auditLogs.isEmpty()}">
              <td colspan="4" style="text-align: center; padding: 40px; color: #999;">
                No audit logs found.
              </td>
            </tr>
            <tr th:each="log : ${auditLogs}">
              <td class="user-id" th:text="${log.userId != null ? log.userId : 'N/A'}"></td>
              <td class="username" th:text="${log.username}"></td>
              <td th:text="${#temporals.format(log.createdAt, 'MMM dd, yyyy hh:mm:ss a')}"></td>
              <td>
                <span class="action-badge" 
                      th:classappend="${log.action == 'Login' ? 'action-login' : (log.action == 'CSV Upload' ? 'action-upload' : (log.action == 'CSV Download' ? 'action-download' : 'action-default'))}"
                      th:text="${log.action}"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div class="pagination">
        <button class="pagination-btn">←</button>
        <span class="pagination-icon">📄</span>
        <input type="text" class="pagination-input" value="1" readonly>
        <span class="pagination-text">/1</span>
        <input type="text" class="pagination-input" th:value="${auditLogs != null ? auditLogs.size() : 0} + ' rows'" readonly>
        <button class="pagination-btn">→</button>
      </div>
    </div>

  </div>
</body>
</html>
