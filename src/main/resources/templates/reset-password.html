<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Reset Password - G-NEWS</title>
  <link rel="stylesheet" th:href="@{/assets/css/login.css}">
  <link rel="stylesheet" th:href="@{/assets/css/global.css}">
  <style>
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #2c3e2d;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    
    .login-header p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .back-link-section {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-header">
      <h1>G-NEWS</h1>
      <p>Reset your password</p>
    </div>

    <form th:action="@{/reset-password}" method="post" class="login-form">
      <input type="hidden" name="token" th:value="${token}" />

      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your new password">
      </div>

      <button type="submit" class="btn">Update Password</button>
    </form>

    <div class="back-link-section">
      <p><a th:href="@{/}" class="link">← Back to Login</a></p>
    </div>
  </div>
</body>
</html>
