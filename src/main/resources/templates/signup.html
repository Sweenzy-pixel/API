<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create Account - G-NEWS</title>
  <link rel="stylesheet" th:href="@{/assets/css/login.css}">
  <link rel="stylesheet" th:href="@{/assets/css/global.css}">
  <style>
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #2c3e2d;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    
    .login-header p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    
    .login-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      text-align: center;
    }
    
    .login-actions p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #999;
      font-size: 13px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .divider::before {
      margin-right: 10px;
    }
    
    .divider::after {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-header">
      <h1>G-NEWS</h1>
      <p>Create your account to get started</p>
    </div>

    <div th:if="${error}" class="error">
      <p th:text="${error}"></p>
    </div>

    <form th:action="@{/signup}" th:object="${user}" method="post" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" th:field="*{email}" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required placeholder="Create a password">
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="login-actions">
      <div class="divider">or</div>
      <p>Already have an account?</p>
      <a th:href="@{/}">
        <button type="button" class="btn secondary">Sign In</button>
      </a>
    </div>
  </div>
</body>
</html>
